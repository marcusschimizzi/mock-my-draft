[project]
name = "text-analysis-service"
version = "1.0.0"
description = "Sentiment analysis and word counting for NFL draft evaluations."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn>=0.30.1",
  "pydantic>=2.8.2",
  "sqlalchemy>=2.0.31",
  "psycopg2-binary>=2.9.9",
  "python-dotenv>=1.2.4",
  "nltk>=3.10.4",
  "scikit-learn>=1.5.1",
]

[dependency-groups]
dev = [
  "autopep8>=2.3.2,<3",
  "flake8>=7.3.0,<8",
  "pytest>=9.0.3,<10",
  "pytest-sugar>=1.1.1,<2",
  "pytest-cov>=7.0.0,<8",
  "pytest-html>=4.1.1,<5",
  "httpx>=0.27.0",
  "pytest-mock>=3.14.0",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
filterwarnings = [
  "error:This process .* is multi-threaded:DeprecationWarning",
]
addopts = "--cov --cov-report html:'../../coverage/apps/text-analysis-service/html' --cov-report xml:'../../coverage/apps/text-analysis-service/coverage.xml' --html='../../reports/apps/text-analysis-service/unittests/html/index.html' --junitxml='../../reports/apps/text-analysis-service/unittests/junit.xml'"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
